[package]
name = "arasaka-usb"
version = "0.2.0"
edition = "2021"
description = "Arasaka USB Flasher — download, verify, and flash the Arasaka Linux image"
license = "MIT"

[dependencies]
anyhow = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
hex = "0.4"
reqwest = { version = "0.12", default-features = false, features = ["blocking", "rustls-tls", "json"] }
urlencoding = "2"

[dependencies.gtk4]
version = "0.9"

[dependencies.glib]
version = "0.20"

[dependencies.gio]
version = "0.20"

[target.'cfg(target_os = "windows")'.dependencies]
windows-sys = { version = "0.59", features = ["Win32_Storage_FileSystem", "Win32_Foundation"] }

[dev-dependencies]
tempfile = "3"

[profile.release]
lto = true
strip = true
